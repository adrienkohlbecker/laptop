# Repo-local tooling for the Tart/Packer test harness only (see packer/).
# This is NOT the machine's runtime config — that lives in the dotfiles repo's
# mise config and is installed by the playbook's mise.yml. Run `mise trust`
# once in this repo, then `mise install`, before `mise run test-vm`.

[tools]
tart = "2.32.1"
packer = "1.15.3"

[tasks.test-vm]
description = "Build a throwaway Tart macOS VM and run install.sh inside it"
dir = "{{ config_root }}/packer"
run = [
  "packer init laptop.pkr.hcl",
  # Extra args land before the template, as `packer build` requires, e.g.
  # `mise run test-vm -- -var vm_base_name=tahoe-vanilla` or `-- -force`.
  "packer build {{arg(name='packer_args', var=true, required=false)}} laptop.pkr.hcl",
]
