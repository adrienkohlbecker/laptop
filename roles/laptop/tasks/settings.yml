---

- name: Create ssh directory
  file:
    path: "~/.ssh"
    state: directory
    mode: "0700"

- name: Create ssh config.d directory
  file:
    path: "~/.ssh/config.d"
    state: directory
    mode: "0700"

- name: Configure SSH to use the macOS Keychain
  copy:
    content: "Host *\n  UseKeychain yes\n"
    dest: "~/.ssh/config.d/keychain"
    mode: "0600"

# The compta (daily) and backup (weekly) jobs are no longer cron entries — they
# are launchd agents/daemons managed by their own repos (~/Work/compta and
# ~/Work/backup, installed via each repo's `mise install-launchd` task).

# softwareupdate has no clean machine-readable signal for whether the schedule
# was already on (its output wording is version-dependent), and re-running it is
# a harmless no-op, so this is intentionally reported as unchanged.
- name: "Check for updates automatically"
  shell: softwareupdate --schedule on
  changed_when: false
  become: true

- name: Check whether ~/Library is hidden
  command: stat -f "%Sf" {{ ansible_user_dir }}/Library
  register: library_flags
  changed_when: false

- name: "Show the ~/Library folder"
  command: chflags nohidden {{ ansible_user_dir }}/Library
  when: "'hidden' in library_flags.stdout"
  changed_when: "'hidden' in library_flags.stdout"

- name: "Save screenshots to ~/Downloads"
  osx_defaults:
    domain: com.apple.screencapture
    key: location
    type: string
    value: ~/Downloads
    state: present

- name: Set faster key repeat rate
  osx_defaults:
    key: KeyRepeat
    type: float
    value: 2
    state: present

- name: Set shorter initial key repeat delay
  osx_defaults:
    key: InitialKeyRepeat
    type: float
    value: 15
    state: present

- name: Set faster dock hide
  osx_defaults:
    domain: com.apple.Dock
    key: autohide-delay
    type: float
    value: 0
    state: present

- name: Disable popup when long-pressing accented keys like "e"
  osx_defaults:
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
    state: present

# tart (cirruslabs) recommends shortening the bootpd DHCP lease from the 86400s
# default to 600s so running many VMs daily doesn't exhaust the lease pool. The
# value lives in a root-owned system plist as a nested dict, which osx_defaults
# can't express, so it is written with `defaults` under become.
- name: Read the bootpd DHCP lease configuration
  command: defaults read /Library/Preferences/SystemConfiguration/com.apple.InternetSharing.default.plist bootpd
  register: bootpd_config
  changed_when: false
  failed_when: false
  become: true

- name: Reduce the DHCP lease time for tart VMs
  command: >-
    defaults write
    /Library/Preferences/SystemConfiguration/com.apple.InternetSharing.default.plist
    bootpd -dict DHCPLeaseTimeSecs -int 600
  when: "'DHCPLeaseTimeSecs = 600' not in bootpd_config.stdout"
  changed_when: true
  become: true
