---

# Installs the Homebrew formulae, casks, and Mac App Store apps declared in the
# repo-root Brewfile. `brew bundle` is idempotent and resolves its own ordering
# (taps -> brews -> casks -> mas), so it replaces the former base/brew/casks/mas
# task files. --no-upgrade keeps already-installed packages pinned (install-only,
# matching the previous homebrew-module behaviour). `mas` itself is listed in the
# Brewfile, so it is installed before the App Store entries are processed.
#
# HOMEBREW_LAPTOP_VM lets the Brewfile skip its App Store apps in the headless
# test VM (mas needs an interactive Apple ID sign-in). It mirrors LAPTOP_VM but
# carries the HOMEBREW_ prefix that survives Homebrew's environment scrubbing;
# it is empty on a real laptop, which the Brewfile treats as "not a VM".
- name: Install Homebrew formulae, casks, and Mac App Store apps from the Brewfile
  command: brew bundle install --no-upgrade --file={{ playbook_dir }}/Brewfile
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
    HOMEBREW_LAPTOP_VM: "{{ lookup('env', 'LAPTOP_VM') }}"
  register: brew_bundle
  changed_when: "'Installing ' in brew_bundle.stdout"
