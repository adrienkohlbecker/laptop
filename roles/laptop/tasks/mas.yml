---
- name: Ensure MAS is installed.
  homebrew:
    name: mas
    state: present
  tags:
    - mas

- name: List installed MAS apps.
  command: mas list
  register: mas_list
  check_mode: no
  changed_when: false
  tags:
    - mas

# App list audited against actually-installed App Store apps (App Store ID via
# `mdls -name kMDItemAppStoreAdamID`, since `mas list` is unreliable here).
- name: Ensure configured MAS apps are installed.
  command: mas install "{{ item }}"
  with_items:
    - '937984704'  # Amphetamine
    - '1381004916' # Discovery / Bonjour Browser
    - '413857545'  # Divvy
    - '424389933'  # Final Cut Pro
    - '414568915'  # Key Codes
    - '1335639877' # Merlin Project
    - '1289583905' # Pixelmator Pro
    - '6745342698' # uBlock Origin Lite
    - '1538878817' # UTM
    - '1408727408' # WiFi Explorer Lite
    - '525912054'  # WiFi Signal
    - '1295203466' # Windows App (formerly Microsoft Remote Desktop)
    - '1451685025' # WireGuard
  when: item not in mas_list.stdout
  tags:
    - mas
